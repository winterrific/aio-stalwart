name: Cleanup Untagged and Unreferenced Images

on:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday at 00:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate cleanup without deleting images (dry-run)'
        required: true
        type: boolean
        default: true

jobs:
  cleanup:
    name: Delete untagged and unreferenced images
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Collect child digests for tagged image indexes
        id: referenced-digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tagged_digests=$(gh api --paginate \
            "/user/packages/container/aio-stalwart/versions?per_page=100" \
            --jq '
              .[] |
              select((.metadata.container.tags // []) | length > 0) |
              .name
            ')
          skip_shas=$(
            while IFS= read -r digest; do
              [ -n "$digest" ] || continue
              docker manifest inspect "ghcr.io/${GITHUB_REPOSITORY}@${digest}" \
                | jq -r '.manifests[]?.digest'
            done <<< "$tagged_digests" | sort -u | paste -sd, -
          )
          echo "skip-shas=$skip_shas" >> "$GITHUB_OUTPUT"

      - name: Delete untagged and unreferenced images
        uses: snok/container-retention-policy@4f22ef80902ad409ed55a99dc5133cc1250a0d03 # v3.0.0
        with:
          account: user # Set to 'user' for personal accounts or your GitHub organization name
          image-names: aio-stalwart
          tag-selection: untagged
          skip-shas: ${{ steps.referenced-digests.outputs.skip-shas }}
          cut-off: 1M # 1 Month
          dry-run: ${{ inputs.dry_run || false }}
          token: ${{ secrets.GITHUB_TOKEN }}
